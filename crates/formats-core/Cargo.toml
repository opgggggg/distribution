[package]
name = "cubeoffice-formats-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
office-browser-abi = { path = "../../als-office/crates/office-browser-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
encoding_rs = "0.8"
ropey = "1.6"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
scraper = { version = "0.23", default-features = false }
sha1 = "0.10"
url = "2.5"
quick-xml = "=0.41.0"
base64 = "=0.22.1"
ttf-parser = "=0.25.1"
png = "=0.17.16"
tiff = "=0.11.3"
fax = "=0.2.7"
pdf-core = { path = "../../als-office/crates/pdf-core" }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
