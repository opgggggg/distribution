server {
    server_name cubexp.com www.cubexp.com 43.159.230.137;

    root /var/www/cubexp.com;
    index index.html;
    charset utf-8;
    client_max_body_size 7m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /updates/latest.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/cubexp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubexp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cubexp.com www.cubexp.com;
    return 301 https://$host$request_uri;
}
