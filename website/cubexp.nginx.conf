server {
    server_name cubexp.com www.cubexp.com 43.159.230.137;

    root /var/www/cubexp.com;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /updates/latest.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/cubexp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubexp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cubexp.com www.cubexp.com;
    return 301 https://$host$request_uri;
}
